# 機械的強制は pre-commit と CI が担う（AI hooks は使わない）。
#
# .claude/ と .agents/ 配下は正本（dotfiles / docbridge）からコピーした vendor 資産のため
# lint / format の対象外にする。整形すると正本との差分が生まれ、再同期のたびに衝突する。
exclude: '^\.(claude|agents)/'

repos:
  # TypeScript / JavaScript — oxlint
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: oxlint
        language: system
        files: \.(js|jsx|ts|tsx|mjs|cjs)$

  # oxfmt — JS/TS/JSON/YAML/Markdown
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: oxfmt --write
        language: system
        files: \.(js|jsx|ts|tsx|mjs|cjs|json|yaml|yml|md)$

  # Markdown — lint
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        files: \.md$

  # TypeScript — 型検査
  # oxlint は型を見ないため、型エラーを止めるのはこの hook だけ。
  # tsconfig 全体を対象にするため pass_filenames: false。実測 1 秒強。
  # node_modules が要る（未導入なら pnpm install を先に実行する）。
  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: pnpm typecheck
        language: system
        files: \.ts$
        pass_filenames: false

  # DocBridge — コードと docs/specs/ のリンク検証
  # 全リポジトリ対象のため pass_filenames: false。実測 0.5 秒未満（500ファイル規模）。
  # バージョンは .docbridge-version が単一の定義元。
  - repo: local
    hooks:
      - id: docbridge-check
        name: docbridge check
        entry: tools/docbridge.sh check
        language: system
        files: \.(ts|md)$
        pass_filenames: false

      # related-gate は informational。push 時のみ実行し、ブロックしない。
      - id: docbridge-related
        name: docbridge related-gate
        entry: tools/docbridge-related.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
