<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>R-004 WebHID probe (Cornix LP)</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 1.5rem;
        line-height: 1.5;
      }
      button {
        margin: 0 0.4rem 0.4rem 0;
        padding: 0.4rem 0.8rem;
      }
      pre {
        background: #f4f4f4;
        padding: 0.8rem;
        overflow-x: auto;
        max-height: 24rem;
      }
      label {
        margin-right: 1rem;
      }
      .warn {
        color: #b00;
      }
    </style>
  </head>
  <body>
    <h1>R-004 WebHID probe</h1>
    <p>
      Cornix LP に対して <strong>read 系 command のみ</strong> を送り、transport ごとの挙動と
      所要時間を記録します。write は行いません。
    </p>

    <p>
      <label>
        transport:
        <select id="transport">
          <option value="usb">USB</option>
          <option value="ble">Bluetooth (BLE)</option>
        </select>
      </label>
      <label>
        timeout(ms):
        <input id="timeout" type="number" value="3000" min="200" step="100" size="6" />
      </label>
    </p>

    <p>
      <button id="list">getDevices() を見る</button>
      <button id="request">requestDevice（0xFF60 filter）</button>
      <button id="requestAny">requestDevice（filter なし）</button>
      <button id="ping">1 command だけ送る</button>
      <button id="read">read フローを実行</button>
      <button id="read2">read フローを 2 回連続で実行</button>
      <button id="close">close()</button>
      <button id="forget">forget()</button>
      <button id="copy">結果を JSON でコピー</button>
      <button id="save">結果を JSON で保存</button>
    </p>

    <p id="status" class="warn"></p>
    <pre id="log"></pre>

    <script type="module">
      import {
        describeDevice,
        isVialDevice,
        requestAnyDevice,
        pingDevice,
        requestVialDevice,
        runReadFlow,
      } from "./probe.mjs";

      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const record = {
        userAgent: navigator.userAgent,
        startedAt: new Date().toISOString(),
        events: [],
      };
      let device = null;

      const stamp = () => new Date().toISOString().slice(11, 23);
      function log(entry) {
        const text = typeof entry === "string" ? entry : JSON.stringify(entry, null, 2);
        logEl.textContent += `[${stamp()}] ${text}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      }
      function note(kind, payload) {
        record.events.push({ at: new Date().toISOString(), kind, payload });
        log({ [kind]: payload });
      }

      if (!("hid" in navigator)) {
        statusEl.textContent = "この browser は WebHID を持っていない（Safari など）";
      }

      // 抜き差し / 電源断で connect / disconnect がどう飛ぶかを見る。
      navigator.hid.addEventListener("connect", (e) => note("connect", describeDevice(e.device)));
      navigator.hid.addEventListener("disconnect", (e) => {
        note("disconnect", describeDevice(e.device));
        if (device === e.device) {
          // 切断後の HIDDevice は opened を true のまま返しつつ sendReport が返らなくなる。
          // 参照を捨てて getDevices() から取り直す。
          device = null;
          statusEl.textContent = "device が切断された。参照を破棄した";
        }
      });

      function transport() {
        return document.getElementById("transport").value;
      }
      function timeoutMs() {
        return Number(document.getElementById("timeout").value);
      }
      // read の直前に必ず呼ぶ。切断を挟むと同じ物理 device でも別の HIDDevice になる。
      async function refreshDevice() {
        const devices = await navigator.hid.getDevices();
        const found = devices.find(isVialDevice) ?? null;
        if (found && found !== device) {
          note("refreshDevice", { 差し替えた: true, ...describeDevice(found) });
          device = found;
        } else if (!found) {
          note("refreshDevice", { 差し替えた: false, 見つからない: true });
        }
        return device;
      }

      function adopt(found) {
        if (!found) {
          note("request", "device が選ばれなかった");
          return;
        }
        device = found;
        note("selected", {
          transport: transport(),
          vialCollection: isVialDevice(found),
          ...describeDevice(found),
        });
      }

      document.getElementById("list").addEventListener("click", async () => {
        const devices = await navigator.hid.getDevices();
        note("getDevices", {
          transport: transport(),
          count: devices.length,
          devices: devices.map(describeDevice),
        });
        if (!device) device = devices.find(isVialDevice) ?? null;
      });

      document.getElementById("request").addEventListener("click", async () => {
        adopt(await requestVialDevice());
      });

      document.getElementById("requestAny").addEventListener("click", async () => {
        adopt(await requestAnyDevice());
      });

      async function readOnce(round) {
        statusEl.textContent = `read 中（${round}）`;
        let last = performance.now();
        const result = await runReadFlow(device, {
          timeoutMs: timeoutMs(),
          onProgress: ({ n, label, ms }) => {
            const now = performance.now();
            if (now - last > 500 || n === 1) {
              logEl.textContent += `[${stamp()}] ${n} 往復目 ${label} ${ms.toFixed(1)}ms\n`;
              last = now;
            }
          },
        });
        statusEl.textContent = "";
        note("readFlow", { transport: transport(), round, timeoutMs: timeoutMs(), ...result });
        return result;
      }

      document.getElementById("read").addEventListener("click", async () => {
        if (!device) {
          statusEl.textContent = "先に device を選ぶ";
          return;
        }
        await refreshDevice();
        note("beforeRead", { opened: device.opened });
        await readOnce("単発");
      });

      // 2 回目が詰まるかどうかを、間に何も挟まずに確かめる。
      document.getElementById("read2").addEventListener("click", async () => {
        if (!device) {
          statusEl.textContent = "先に device を選ぶ";
          return;
        }
        await refreshDevice();
        note("beforeRead", { opened: device.opened });
        await readOnce("1 回目");
        note("betweenReads", { opened: device.opened });
        await readOnce("2 回目");
      });

      // BLE の切り分け用。read フロー全体ではなく 1 往復だけ試す。
      document.getElementById("ping").addEventListener("click", async () => {
        await refreshDevice();
        if (!device) {
          statusEl.textContent = "device が無い。requestDevice する";
          return;
        }
        note("ping", {
          transport: transport(),
          opened: device.opened,
          ...(await pingDevice(device, timeoutMs())),
        });
      });

      document.getElementById("close").addEventListener("click", async () => {
        if (!device) return;
        await device.close();
        note("close", { opened: device.opened });
      });

      document.getElementById("forget").addEventListener("click", async () => {
        if (!device) return;
        await device.forget();
        note("forget", "権限を破棄した。再読み込み後に getDevices() が空なら永続化されていない");
        device = null;
      });

      // read した生 byte も含むため、貼り付けではなくファイルで持ち帰る用。
      document.getElementById("save").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(record, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `r-004-${transport()}-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        statusEl.textContent = `保存した: ${a.download}`;
      });

      document.getElementById("copy").addEventListener("click", async () => {
        await navigator.clipboard.writeText(JSON.stringify(record, null, 2));
        statusEl.textContent = "clipboard へコピーした";
      });
    </script>
  </body>
</html>
