name: Setup Node.js and pnpm
description: Set up the repository's pinned Node.js major and pnpm major
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
