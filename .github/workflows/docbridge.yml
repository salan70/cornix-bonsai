name: docbridge

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # check（リンク切れ検証）は fail させる。
  # related-gate は informational で、fail させず sticky コメントで報告する。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # バージョンの単一の定義元は .docbridge-version
      - name: Resolve DocBridge version
        run: echo "DOCBRIDGE_VERSION=$(tr -d '[:space:]' < .docbridge-version)" >> "$GITHUB_ENV"

      - name: DocBridge check
        run: npx -y "docbridge@${DOCBRIDGE_VERSION}" check

      # check が落ちても related-gate のレポートは出す。
      - name: Run related-gate over the PR change set
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            -q '.[].filename' > changed-files.txt
          gate_status=0
          npx -y "docbridge@${DOCBRIDGE_VERSION}" related --stdin --gate \
            < changed-files.txt > gate-output.txt 2> gate-error.txt \
            || gate_status=$?
          cat gate-error.txt >&2
          if [ "$gate_status" != "0" ] && [ ! -s gate-output.txt ]; then
            echo "DocBridge related-gate がレポートを生成できませんでした。詳細は CI ログを確認してください。" \
              > gate-output.txt
          fi
          echo "GATE_STATUS=${gate_status}" >> "$GITHUB_ENV"
          cat gate-output.txt

      - name: Create or update the sticky PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- docbridge-related-gate -->'
          {
            echo "$marker"
            echo "## DocBridge related-gate"
            echo
            if [ "$GATE_STATUS" = "0" ]; then
              echo "変更ファイルにリンクされたカウンターパートは、すべてこの PR の変更セットに含まれています。"
            else
              echo "変更ファイルに、この PR で更新されていないリンク先カウンターパートがあります。"
              echo "各項目について、カウンターパートを更新するか、更新不要な理由を PR に記載してください。"
              echo
              echo '```'
              cat gate-output.txt
              echo '```'
            fi
          } > comment.md
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            -q ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@comment.md
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md
          fi
